<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acesso Negado</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Google: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          }
        }
      }
    </script>
</head>
<body class="h-full bg-slate-950 font-sans text-slate-100 flex items-center justify-center p-4 min-h-screen relative overflow-hidden select-none">
    
    <!-- Luzes de fundo com brilho suave (Glow Effects) -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] sm:w-[600px] h-[450px] sm:h-[600px] bg-red-600/15 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-[250px] h-[250px] bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Card Principal com efeito Glassmorphism -->
    <main class="relative z-10 max-w-md w-full bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-8 sm:p-10 shadow-2xl text-center flex flex-col items-center transition-all duration-300 hover:border-slate-700/80">
        
        <!-- Ícone de Cadeado em Destaque -->
        <div class="relative mb-6">
            <div class="w-20 h-20 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400 shadow-inner shadow-red-500/10 group">
                <!-- SVG Ícone de Segurança -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 transform group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <!-- Ponto Pulsante de Alerta -->
            <span class="absolute -top-1 -right-1 flex h-4 w-4">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-4 w-4 bg-red-500"></span>
            </span>
        </div>

        <!-- Tag de Erro 403 -->
        <span class="inline-block px-3.5 py-1 text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-500/10 border border-red-500/20 rounded-full mb-4">
            Erro 403 &bull; Permissão Negada
        </span>

        <!-- Título e Mensagem em Português -->
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-3">
            Acesso Negado
        </h1>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8">
            Você não possui permissão suficiente para acessar este recurso ou esta área do sistema. Verifique suas credenciais ou entre em contato com o administrador.
        </p>

        <!-- Grupo de Botões -->
        <div class="w-full flex flex-col sm:flex-row gap-3">
            <a href="/" class="w-full sm:w-1/2 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm transition-all duration-200 shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 group">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Início
            </a>
            <a href="/login" class="w-full sm:w-1/2 py-3 px-4 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 active:bg-slate-800 border border-slate-700/60 text-slate-200 hover:text-white font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
